# .air.toml
# Live reloading configuration for Air (github.com/air-verse/air)

root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -trimpath -o ./tmp/main ./backend/cmd/squirrel"
bin = "tmp/main"
pre_cmd = ["npm --prefix ui run build"]
include_ext = ["go", "ts", "tsx", "css", "html"]
exclude_dir = ["tmp", "bin", "ui/dist", "ui/node_modules", "data", ".git", ".gemini"]
include_dir = ["backend", "ui/src", "proto"]
delay = 500
stop_on_error = false

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"
