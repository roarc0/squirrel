syntax = "proto3";

package v1;

option go_package = "loot/proto/gen/go/v1;portv1";

message ExportBackupRequest {}

message ExportBackupResponse {
  // Gzipped tar archive containing database files.
  bytes backup_tar_gz = 1;
  // Suggested backup filename.
  string filename = 2;
}

message RestoreBackupRequest {
  // Gzipped tar archive payload.
  bytes backup_tar_gz = 1;
}

message RestoreBackupResponse {
  bool success = 1;
  string message = 2;
}

message ListAIModelsRequest {}

// AIModelInfo represents an available or downloaded open-weights GGUF AI model.
message AIModelInfo {
  // Model identifier e.g. "qwen2.5-3b-instruct".
  string id = 1;
  // Human-readable model display name.
  string name = 2;
  // File name in data/models/ directory e.g. "qwen2.5-3b-instruct-q4_k_m.gguf".
  string filename = 3;
  // File size in bytes (0 if not yet downloaded).
  int64 size_bytes = 4;
  // Whether the model file is already saved in data/models/.
  bool is_downloaded = 5;
  // Direct download URL on Hugging Face.
  string source_url = 6;
  // Model description and specs.
  string description = 7;
  // Current live download progress percentage (0 to 100).
  int32 download_percent = 8;
  // Whether this model is currently downloading in background.
  bool is_downloading = 9;
}

message ListAIModelsResponse {
  repeated AIModelInfo models = 1;
}

message DownloadAIModelRequest {
  // Model ID or Hugging Face repository name (e.g. "Qwen/Qwen2.5-1.5B-Instruct-GGUF").
  string model_name = 1;
  // Optional direct GGUF URL override.
  string url_override = 2;
}

message DownloadAIModelResponse {
  bool success = 1;
  string message = 2;
  string model_id = 3;
  string file_path = 4;
}

// SystemService manages database backups, system state, and local AI model management.
service SystemService {
  // Export a complete encrypted backup archive of the SQLite database.
  rpc ExportBackup(ExportBackupRequest) returns (ExportBackupResponse);
  // Restore the database state from a backup archive.
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse);
  // List available recommended and downloaded open-weights AI models in data/models/.
  rpc ListAIModels(ListAIModelsRequest) returns (ListAIModelsResponse);
  // Download an open-weights GGUF AI model into data/models/ given a name or Hugging Face repo.
  rpc DownloadAIModel(DownloadAIModelRequest) returns (DownloadAIModelResponse);
}
