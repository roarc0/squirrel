syntax = "proto3";

package v1;

option go_package = "squirrel/proto/gen/go/v1;portv1";

message ExportBackupRequest {}

message ExportBackupResponse {
  // JSON backup of the authenticated user's data.
  bytes backup_data = 1;
  // Suggested backup filename (e.g. squirrel-backup-2024-01-01.json).
  string filename = 2;
}

message RestoreBackupRequest {
  // JSON backup payload as produced by ExportBackup.
  bytes backup_data = 1;
}

message RestoreBackupResponse {
  bool success = 1;
  string message = 2;
}

message ListAIModelsRequest {}

// AIModelInfo represents an available or downloaded open-weights GGUF AI model.
message AIModelInfo {
  // Model identifier e.g. "qwen2.5-3b-instruct".
  string id = 1;
  // Human-readable model display name.
  string name = 2;
  // File name in data/models/ directory e.g. "qwen2.5-3b-instruct-q4_k_m.gguf".
  string filename = 3;
  // File size in bytes (0 if not yet downloaded).
  int64 size_bytes = 4;
  // Whether the model file is already saved in data/models/.
  bool is_downloaded = 5;
  // Direct download URL on Hugging Face.
  string source_url = 6;
  // Model description and specs.
  string description = 7;
  // Current live download progress percentage (0 to 100).
  int32 download_percent = 8;
  // Whether this model is currently downloading in background.
  bool is_downloading = 9;
}

message ListAIModelsResponse {
  repeated AIModelInfo models = 1;
}

message DownloadAIModelRequest {
  // Model ID or Hugging Face repository name (e.g. "Qwen/Qwen2.5-1.5B-Instruct-GGUF").
  string model_name = 1;
  // Optional direct GGUF URL override.
  string url_override = 2;
}

message DownloadAIModelResponse {
  bool success = 1;
  string message = 2;
  string model_id = 3;
  string file_path = 4;
}

// ChatMessagePayload represents a message turn in conversation history.
message ChatMessagePayload {
  string role = 1;
  string content = 2;
}

// StreamChatRequest passes AI provider credentials, model selection, chat history, portfolio context, and max context window size.
message StreamChatRequest {
  string provider = 1;
  string endpoint = 2;
  string model = 3;
  string api_key = 4;
  repeated ChatMessagePayload messages = 5;
  string portfolio_context_json = 6;
  int32 context_size = 7;
}

// StreamChatResponse represents streaming token chunks or MCP tool execution events.
message StreamChatResponse {
  string delta_text = 1;
  bool is_mcp_tool_call = 2;
  string tool_name = 3;
  string tool_args_json = 4;
  string tool_result_json = 5;
  bool done = 6;
  // Actual server context window detected at request time (0 if unknown).
  int32 actual_n_ctx = 7;
}

message RestartLocalServerRequest {
  string model_filename = 1;
  int32 context_size = 2;
  int32 port = 3;
}

message RestartLocalServerResponse {
  bool success = 1;
  string message = 2;
  int32 port = 3;
  int32 actual_n_ctx = 4;
}

message ListOllamaModelsRequest {
  string endpoint = 1;
}

message OllamaModelInfo {
  string name = 1;
  int64 size_bytes = 2;
  string modified_at = 3;
}

message ListOllamaModelsResponse {
  repeated OllamaModelInfo models = 1;
}

message LoadOllamaModelRequest {
  string endpoint = 1;
  string model = 2;
  int32 context_size = 3;
}

message LoadOllamaModelResponse {
  bool success = 1;
  string message = 2;
}

// SystemService manages database backups, system state, local AI models, and Connect Protobuf AI streaming.
service SystemService {
  // Export a complete encrypted backup archive of the SQLite database.
  rpc ExportBackup(ExportBackupRequest) returns (ExportBackupResponse);
  // Restore the database state from a backup archive.
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse);
  // List available recommended and downloaded open-weights AI models in data/models/.
  rpc ListAIModels(ListAIModelsRequest) returns (ListAIModelsResponse);
  // Download an open-weights GGUF AI model into data/models/ given a name or Hugging Face repo.
  rpc DownloadAIModel(DownloadAIModelRequest) returns (DownloadAIModelResponse);
  // Stream AI assistant chat tokens and MCP tool calls over Connect Protobuf server-streaming.
  rpc StreamChat(StreamChatRequest) returns (stream StreamChatResponse);
  // List models available in a running Ollama instance.
  rpc ListOllamaModels(ListOllamaModelsRequest) returns (ListOllamaModelsResponse);
  // Load an Ollama model into memory with the specified context size.
  rpc LoadOllamaModel(LoadOllamaModelRequest) returns (LoadOllamaModelResponse);
  // Kill and restart the local llama-server process with a new model and context size.
  rpc RestartLocalServer(RestartLocalServerRequest) returns (RestartLocalServerResponse);
}
