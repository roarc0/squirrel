syntax = "proto3";

package v1;

option go_package = "loot/proto/gen/go/v1;portv1";

message InstrumentAllocation {
  string asset_class = 1;
  int64 value_minor = 2;
}

message CurrencySummary {
  string currency = 1;
  int64 balance_minor = 2;
  int64 gross_revenue_minor = 3;
  int64 tax_minor = 4;
  int64 fees_minor = 5;
  int64 net_revenue_minor = 6;
  int64 invested_minor = 7;
  int64 portfolio_minor = 8;
  int64 total_minor = 9;
  repeated InstrumentAllocation allocations = 10;
}

message Diagnostic {
  string id = 1;
  string category = 2;
  string severity = 3;
  string title = 4;
  string message = 5;
  int64 holding_id = 6;
  int64 account_id = 7;
  string isin = 8;
}

message Summary {
  string base_currency = 1;
  repeated CurrencySummary currencies = 2;
  repeated Diagnostic diagnostics = 3;
}

message GetSummaryRequest {
  optional int64 target_cash_minor = 1;
}

message GetSummaryResponse {
  Summary summary = 1;
}

service SummaryService {
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
}
