syntax = "proto3";

package v1;

option go_package = "github.com/roarc0/squirrel/proto/gen/go/v1;portv1";

// UserProfile stores per-user application preferences.
message UserProfile {
  // UI color scheme: "light", "dark", or "" for system default.
  optional string theme = 1;
  // Preferred display currency code e.g. "EUR", "USD".
  optional string preferred_currency = 2;
  // Monthly living expenses in minor units (cents) for emergency reserve calculation.
  optional int64 monthly_expenses_minor = 3;
  // Number of months of expenses to target as emergency reserve (default 6).
  optional int32 reserve_months = 4;
  // Whether to hide monetary balances in the UI.
  optional bool hide_balances = 5;
  // Target emergency cash reserve in minor units (cents).
  optional int64 emergency_goal_minor = 6;
  // Annual expenses for FIRE calculation in minor units (cents).
  optional int64 fire_expenses_minor = 7;
  // JSON string of visible instrument column IDs for the instrument finder.
  optional string instrument_columns_json = 8;
  // Whether to show the FIRE / financial independence calculator on the Overview.
  optional bool show_fire_calculator = 9;
  // Whether to enable the BTP Rank plugin section.
  optional bool enable_btp_ranks = 10;
  // Currently active navigation tab e.g. "overview", "investments", "btp".
  optional string active_tab = 11;
  // JSON string of AI Assistant configuration settings.
  optional string ai_settings_json = 12;
  // JSON string of custom draft portfolios.
  optional string draft_portfolios_json = 13;
  // User description detailing investment objectives, risk exposure/tolerance, age, sex/gender, time horizon, etc.
  optional string user_description = 14;
  // List of starred instrument ISINs for the active user.
  repeated string starred_instruments = 15;
  // List of starred BTP ISINs for the active user.
  repeated string starred_btps = 16;
}

message GetProfileRequest {}

message GetProfileResponse {
  UserProfile profile = 1;
}

message UpdateProfileRequest {
  UserProfile profile = 1;
}

message UpdateProfileResponse {
  UserProfile profile = 1;
}

// ProfileService manages per-user application preferences.
service ProfileService {
  // Get the authenticated user's profile and preferences.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  // Update the authenticated user's profile preferences.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
}
